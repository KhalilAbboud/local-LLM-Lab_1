[project]
name = "lab-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dev-N-X", email = "kalil.about@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "ollama>=0.6.2",
    "streamlit>=1.64.0",
    "torch>=2.14.1",
    "torcheval>=0.0.7",
    "torchmetrics>=1.9.0",
    "torchviz>=0.0.3",
]

[project.scripts]
lab-1 = "lab_1:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
